server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uma API indisponível nunca deve receber o HTML da aplicação como resposta.
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"RESOURCE_NOT_FOUND","message":"Use o Gateway para acessar a API."}}';
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Permite abrir e atualizar /eventos/:id e /pedidos/:id diretamente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
