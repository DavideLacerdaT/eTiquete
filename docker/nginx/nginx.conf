events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location / {
            default_type application/json;
            return 200 '{"service":"etiquete-gateway"}';
        }

        # Rotas dos microsserviços, quando existirem.
